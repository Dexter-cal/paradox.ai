<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prob AI | V5 Neural Discovery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --sidebar-width: 240px; --bg-main: #0d1117; --bg-card: #161b22; --border-color: #30363d; --accent: #58a6ff; --thought-bg: #1c2128; }
        body { background-color: var(--bg-main); color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .sidebar { background-color: var(--bg-card); min-height: 100vh; padding: 20px; border-right: 1px solid var(--border-color); position: fixed; width: var(--sidebar-width); }
        .main-content { margin-left: var(--sidebar-width); padding: 20px; display: flex; gap: 20px; }
        .thought-stream { width: 350px; background: var(--thought-bg); border-radius: 8px; border: 1px solid var(--border-color); height: calc(100vh - 40px); display: flex; flex-column: column; overflow: hidden; position: fixed; right: 20px; }
        .thought-header { padding: 10px; border-bottom: 1px solid var(--border-color); background: #21262d; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        .thought-body { flex: 1; overflow-y: auto; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 0.75rem; }
        .nav-link { color: #8b949e; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; padding: 10px; border-radius: 6px; }
        .nav-link.active { color: var(--accent); background: #21262d; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 20px; }
        .tab-content { display: none; width: calc(100% - 370px); }
        .tab-content.active { display: block; }
        .duel-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; }
        .inquisitor { background: #d29922; color: black; }
        .solver { background: #238636; color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4 class="mb-4"><i class="fas fa-brain text-primary"></i> Prob AI <small class="text-muted" style="font-size: 0.5rem;">V5</small></h4>
        <nav class="nav flex-column">
            <a class="nav-link active" onclick="showTab('research')"><i class="fas fa-search me-2"></i>Research Hub</a>
            <a class="nav-link" onclick="showTab('duel')"><i class="fas fa-swords me-2"></i>Curiosity Duel</a>
            <a class="nav-link" onclick="showTab('adv')"><i class="fas fa-microchip me-2"></i>Advanced Dev</a>
            <a class="nav-link" onclick="showTab('api')"><i class="fas fa-network-wired me-2"></i>External Nexus</a>
        </nav>
    </div>

    <div class="main-content">
        <!-- Research Hub -->
        <div id="research" class="tab-content active">
            <div class="card">
                <div class="card-header">Main Reasoning Hub</div>
                <div class="card-body">
                    <textarea id="query" class="form-control mb-3 bg-dark text-white" rows="4" placeholder="Enter research query..."></textarea>
                    <button class="btn btn-primary w-100" onclick="ask()">Execute Discovery</button>
                </div>
            </div>
            <div id="results" class="card p-3 font-monospace small">Ready for input...</div>
        </div>

        <!-- Curiosity Duel -->
        <div id="duel" class="tab-content">
            <div class="card">
                <div class="card-header">Inquisitor vs Solver Duel</div>
                <div class="card-body">
                    <input type="text" id="duel-topic" class="form-control mb-3 bg-dark text-white" placeholder="Target Topic (e.g. Dark Matter)">
                    <button class="btn btn-success w-100" onclick="runDuel()">Initiate Neural Combat</button>
                    <hr>
                    <div id="duel-scores" class="d-flex justify-content-around mb-3">
                        <div class="text-center"><span class="duel-badge inquisitor">INQUISITOR</span><br><h3 id="score-inq">0</h3></div>
                        <div class="text-center"><span class="duel-badge solver">SOLVER</span><br><h3 id="score-sol">0</h3></div>
                    </div>
                    <div id="duel-result" class="small p-2 border rounded"></div>
                </div>
            </div>
        </div>

        <!-- Advanced Dev -->
        <div id="adv" class="tab-content">
            <div class="card">
                <div class="card-header">Discovery Post-Processing</div>
                <div class="card-body">
                    <textarea id="adv-input" class="form-control mb-3 bg-dark text-white" rows="3" placeholder="Paste discovery for processing..."></textarea>
                    <div class="d-flex gap-2">
                        <button class="btn btn-warning btn-sm" onclick="checkParadox()">Detect Paradox</button>
                        <button class="btn btn-info btn-sm" onclick="forecast()">Forecast Impact</button>
                    </div>
                    <div id="adv-result" class="mt-3 small p-2 bg-black rounded"></div>
                </div>
            </div>
        </div>

        <!-- Thought Stream Sidebar -->
        <div class="thought-stream">
            <div class="thought-header"><i class="fas fa-stream me-2"></i>Live Neural Trace</div>
            <div class="thought-body" id="thought-log"></div>
        </div>
    </div>

    <script>
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            event.target.closest('.nav-link').classList.add('active');
        }

        async function ask() {
            const query = document.getElementById('query').value;
            const res = await fetch('/api/ask', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query}) });
            const data = await res.json();
            document.getElementById('results').innerText = data.result;
        }

        async function runDuel() {
            const topic = document.getElementById('duel-topic').value;
            const res = await fetch('/api/duel/run', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({topic}) });
            const data = await res.json();
            document.getElementById('score-inq').innerText = data.scores.inquisitor;
            document.getElementById('score-sol').innerText = data.scores.solver;
            document.getElementById('duel-result').innerHTML = `<strong>Q:</strong> ${data.questions}<br><br><strong>A:</strong> ${data.answer}`;
        }

        async function checkParadox() {
            const disc = document.getElementById('adv-input').value;
            const res = await fetch('/api/adv/paradox', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({discovery: disc}) });
            const data = await res.json();
            document.getElementById('adv-result').innerText = data.result;
        }

        async function forecast() {
            const disc = document.getElementById('adv-input').value;
            const res = await fetch('/api/adv/forecast', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({discovery: disc}) });
            const data = await res.json();
            document.getElementById('adv-result').innerText = data.result;
        }

        async function pollThoughts() {
            const res = await fetch('/api/thoughts');
            const data = await res.json();
            let html = "";
            data.forEach(t => {
                const color = t.agent === 'inquisitor' ? '#d29922' : t.agent === 'solver' ? '#238636' : '#58a6ff';
                html += `<div style="margin-bottom:8px; border-left: 2px solid ${color}; padding-left: 8px;">
                    <span style="color:${color}; font-weight:bold;">[${t.agent.toUpperCase()}]</span> ${t.msg}
                </div>`;
            });
            document.getElementById('thought-log').innerHTML = html;
            const body = document.getElementById('thought-log');
            body.scrollTop = body.scrollHeight;
        }

        setInterval(pollThoughts, 2000);
    </script>
</body>
</html>
