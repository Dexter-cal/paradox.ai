<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prob AI | Authentication Required</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .form-control { background-color: #0d1117; border: 1px solid #30363d; color: #c9d1d9; }
        .btn-primary { background-color: #238636; border-color: #2ea043; width: 100%; font-weight: 600; }
        .btn-primary:hover { background-color: #2ea043; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <i class="fas fa-brain fa-3x text-primary mb-4"></i>
        <h3 class="mb-3">Prob <span class="text-primary">Nexus</span></h3>
        <p class="text-muted small mb-4">Autonomous Discovery Environment Sovereign Access</p>

        {% if error %}
        <div class="alert alert-danger small">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-4 text-start">
                <label class="form-label small text-muted">Access Key</label>
                <input type="password" name="password" class="form-control" placeholder="Enter Sovereignty Key" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary">Establish Link</button>
        </form>

        <div class="mt-4 small text-muted">
            <i class="fas fa-shield-alt me-1"></i> End-to-End Neural Encryption Active
        </div>
    </div>
</body>
</html>
